spring.application.name=mail-platform
spring.config.import=optional:file:.env[.properties]
app.worker.enabled=${APP_WORKER_ENABLED:true}
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mail_platform}
spring.datasource.username=${DB_USERNAME:mail_platform}
spring.datasource.password=${DB_PASSWORD:mail_platform}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.mail.from=${MAIL_FROM:no-reply@example.com}
app.mail.from-name=${MAIL_FROM_NAME:Mail Platform}
app.mail.client-template-access=${CLIENT_TEMPLATE_ACCESS:}
app.mail.client-display-names=${CLIENT_DISPLAY_NAMES:}
app.security.internal-api-keys=${INTERNAL_API_KEYS:}
app.security.admin-api-key=${ADMIN_API_KEY:}
app.security.api-key-pepper=${API_KEY_PEPPER:}
app.security.webhook-encryption-key=${WEBHOOK_ENCRYPTION_KEY:}
app.security.allow-legacy-keys=${ALLOW_LEGACY_KEYS:true}
app.security.otp-hmac-secret=${OTP_HMAC_SECRET}
app.security.sensitive-payload-key=${SENSITIVE_PAYLOAD_KEY}
app.docs.public=${DOCS_PUBLIC:false}
app.attachments.antivirus.enabled=${ATTACHMENTS_AV_ENABLED:false}
app.attachments.antivirus.host=${CLAMAV_HOST:}
app.attachments.antivirus.port=${CLAMAV_PORT:3310}
app.attachments.orphan-retention-hours=${ATTACHMENTS_ORPHAN_RETENTION_HOURS:48}
app.metrics.refresh-interval-ms=${METRICS_REFRESH_INTERVAL_MS:30000}
app.metrics.dependency-poll-interval-ms=${METRICS_DEPENDENCY_POLL_INTERVAL_MS:30000}
app.maintenance.cleanup-interval-ms=${MAINTENANCE_CLEANUP_INTERVAL_MS:3600000}
app.campaign.poll-interval-ms=${CAMPAIGN_POLL_INTERVAL_MS:1000}
app.campaign.drain-size=${CAMPAIGN_DRAIN_SIZE:100}
# Marketing remains unavailable until a public unsubscribe origin is configured.
app.marketing.public-base-url=${MARKETING_PUBLIC_BASE_URL:}
app.marketing.unsubscribe-token-days=${MARKETING_UNSUBSCRIBE_TOKEN_DAYS:90}
# Requires a downstream SMTP relay to DKIM-sign both List-Unsubscribe headers (RFC 8058).
app.marketing.one-click-headers-enabled=${MARKETING_ONE_CLICK_ENABLED:true}

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=32MB
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

app.outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS:1000}
app.outbox.batch-size=${OUTBOX_BATCH_SIZE:10}
app.outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:10}
app.outbox.lease-seconds=${OUTBOX_LEASE_SECONDS:120}

app.delivery.max-attempts=${DELIVERY_MAX_ATTEMPTS:5}
app.delivery.processing-stale-seconds=${DELIVERY_PROCESSING_STALE_SECONDS:300}
app.delivery.heartbeat-interval-ms=${DELIVERY_HEARTBEAT_INTERVAL_MS:30000}
app.delivery.stale-recovery-interval-ms=${DELIVERY_STALE_RECOVERY_INTERVAL_MS:60000}
app.delivery.stale-recovery-batch-size=${DELIVERY_STALE_RECOVERY_BATCH_SIZE:100}
spring.task.scheduling.pool.size=4
app.sensitive-payload.cleanup-interval-ms=${SENSITIVE_PAYLOAD_CLEANUP_INTERVAL_MS:60000}
app.sensitive-payload.cleanup-batch-size=${SENSITIVE_PAYLOAD_CLEANUP_BATCH_SIZE:500}

spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

app.webhooks.poll-interval-ms=${WEBHOOK_POLL_INTERVAL_MS:10000}
app.webhooks.batch-size=${WEBHOOK_BATCH_SIZE:10}

# Keep multipart uploads on disk until validated to avoid heap amplification.
spring.servlet.multipart.file-size-threshold=0B

# The request ID is correlated across access/error logs without including client PII in Prometheus labels.
logging.pattern.level=%5p [requestId:%X{requestId:-none}]

# Readiness fails on loss of critical dependencies; liveness stays process-only.
management.endpoint.health.group.readiness.include=readinessState,db,rabbit
management.endpoint.health.show-details=never
