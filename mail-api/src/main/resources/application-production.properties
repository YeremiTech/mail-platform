# Activate with SPRING_PROFILES_ACTIVE=production. Required secrets are supplied externally.
app.security.allow-legacy-keys=false
app.docs.public=false
app.attachments.antivirus.enabled=true
# Fail if production cannot enforce STARTTLS and validate the SMTP peer certificate.
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.jpa.open-in-view=false

# Set MARKETING_PUBLIC_BASE_URL to the externally reachable HTTPS origin. RFC 8058 headers are enabled by default; set MARKETING_ONE_CLICK_ENABLED=false only for a relay that cannot DKIM-sign them.
